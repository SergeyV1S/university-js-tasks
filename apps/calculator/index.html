<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="display-containter">
        <output id="display" class="display">0</output>
        <output id="display-number" class="display-number">0</output>
      </div>

      <div id="keyboard" class="keyboard">
        <button id="memory_inc" class="button gray">M+</button>
        <button id="memory_dsc" class="button gray">M-</button>
        <button id="memory_read" class="button gray">MR</button>
        <button id="memory_save" class="button gray">MS</button>
        <button id="all_clean" class="button gray">AC</button>
        <button id="memory_clear" class="button gray">MC</button>
        <button id="percent" class="button gray">%</button>
        <button id="divide" class="button orange">÷</button>
        <button class="button">7</button>
        <button class="button">8</button>
        <button class="button">9</button>
        <button id="multiply" class="button orange">×</button>
        <button class="button">4</button>
        <button class="button">5</button>
        <button class="button">6</button>
        <button id="minus" class="button orange">-</button>
        <button class="button">1</button>
        <button class="button">2</button>
        <button class="button">3</button>
        <button id="plus" class="button orange">+</button>
        <button class="button zero">0</button>
        <button id="comma" class="button">,</button>
        <button id="equal" class="button orange">=</button>
      </div>
    </div>
  </body>
</html>
