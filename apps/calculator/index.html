<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Calculator</title>
  </head>
  <script defer type="module" src="scripts/index.js"></script>
  <body>
    <div class="container">
      <div class="display-containter">
        <output id="display" class="display display-hide">0</output>
        <output id="display-number" class="display-number">0</output>
      </div>

      <div id="keyboard" class="keyboard">
        <button value="M+" class="button gray">M+</button>
        <button value="M-" class="button gray">M-</button>
        <button value="MR" class="button gray">MR</button>
        <button value="MS" class="button gray">MS</button>
        <button value="Delete" class="button gray">AC</button>
        <button value="MC" class="button gray">MC</button>
        <button value="%" class="button gray">%</button>
        <button value="/" class="button orange">÷</button>
        <button value="7" class="button">7</button>
        <button value="8" class="button">8</button>
        <button value="9" class="button">9</button>
        <button value="*" class="button orange">×</button>
        <button value="4" class="button">4</button>
        <button value="5" class="button">5</button>
        <button value="6" class="button">6</button>
        <button value="-" class="button orange">-</button>
        <button value="1" class="button">1</button>
        <button value="2" class="button">2</button>
        <button value="3" class="button">3</button>
        <button value="+" class="button orange">+</button>
        <button value="0" class="button zero">0</button>
        <button value="," class="button">,</button>
        <button value="Enter" class="button orange">=</button>
      </div>
    </div>
  </body>
</html>
