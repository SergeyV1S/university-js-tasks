<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="input-wrapper">
        <input type="number" name="input" id="input" dir="rtl" placeholder="0" />
      </div>

      <div class="keyboard">
        <div class="button gray">M+</div>
        <div class="button gray">M-</div>
        <div class="button gray">MR</div>
        <div class="button gray">MS</div>
        <div class="button gray">AC</div>
        <div class="button gray">MC</div>
        <div class="button gray">%</div>
        <div class="button orange">÷</div>
        <div class="button">7</div>
        <div class="button">8</div>
        <div class="button">9</div>
        <div class="button orange">×</div>
        <div class="button">4</div>
        <div class="button">5</div>
        <div class="button">6</div>
        <div class="button orange">-</div>
        <div class="button">1</div>
        <div class="button">2</div>
        <div class="button">3</div>
        <div class="button orange">+</div>
        <div class="button zero">0</div>
        <div class="button">,</div>
        <div class="button orange">=</div>
      </div>
    </div>
  </body>
</html>
